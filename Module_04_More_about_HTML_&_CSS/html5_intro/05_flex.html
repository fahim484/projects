<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container {
            display: flex;
        }

        .container div {
            border: 2px solid tomato;
            height: 5rem;
            width: 8rem;
            font-size: 3rem;
        }

        .box-container {
            display: flex;
            gap: 3.1rem;
        }

        .box {
            font-size: 4rem;
            height: 7rem;
            width: 7rem;
            border: 2px solid slateblue;
        }

        .user-container {
            display: flex;
            /* justify-content: center; */
            /* justify-content: space-between; */
            justify-content: space-around;
        }

        .user{
            border: 4px solid skyblue;
            height: 9.3rem;
            width: 9.3rem;
            font-size: 2rem;
            background-color: blanchedalmond;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>

    <!-- .box{$}*6 -->

    <div class="box-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

    <div class="user-container">
        <!-- .user{user-$}*3 -->
        <div class="user">user-1</div>
        <div class="user">user-2</div>
        <div class="user">user-3</div>
    </div>

    <div class="card-container">
        <!-- .user{user-$}*12 -->
        <div class="user">user-1</div>
        <div class="user">user-2</div>
        <div class="user">user-3</div>
        <div class="user">user-4</div>
        <div class="user">user-5</div>
        <div class="user">user-6</div>
        <div class="user">user-7</div>
        <div class="user">user-8</div>
        <div class="user">user-9</div>
        <div class="user">user-10</div>
        <div class="user">user-11</div>
        <div class="user">user-12</div>
        <div class="user">user-13</div>
        <div class="user">user-14</div>
        <div class="user">user-15</div>
        <div class="user">user-16</div>
        <div class="user">user-17</div>
        <div class="user">user-18</div>
        <div class="user">user-19</div>
        <div class="user">user-20</div>
    </div>
</body>
</html>
