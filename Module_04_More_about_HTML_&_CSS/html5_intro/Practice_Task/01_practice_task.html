<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Task 01</title>
    <link rel="stylesheet" href="css/01_practice_task.css">
</head>
<body>
    <header>

    </header>
    <main>
        <!-- search section start -->
        <section class="search-section">
            <hr>
            <form>
            <label for="searchbar">Search your Image here:</label>
            <input type="search" name="searchbar" id="searchbar" required>
            <button type="button" class="btn">Search</button>
            </form>

            <img src="images/Kung_Fu_Panda.png" alt="A Kung_Fu_Panda kick"  class="panda-img">
            <a href="https://www.google.com/" target="_blank">For more click here</a>
            <hr>
        </section>
        <!-- search section end -->
         <!-- feedback section start -->
          <section>
            <form>
                <h2>Feedback Form:</h2>
                <label for="name">Name:</label>
                <br>
                <input type="text" name="name" id="name" autocomplete="name" required>
                <br>
                <label for="date">Date:</label>
                <br>
                <input type="date" name="date" id="date" required>
                <br>
                <label for="comment">Comment:</label>
                <br>
                <textarea name="comment" id="comment" rows="6" cols="60" required></textarea>
                <br> <br>
                <button type="submit" class="btn">Submit</button>
            </form>
          </section>
         <!-- feedback section end -->
    </main>
    <footer>

    </footer>
</body>
</html>
